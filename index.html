<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovative PNG Ltd | Stationery, Mobile & Laptop Accessories – Mount Hagen</title>
  <meta name="description" content="Mount Hagen stationery, phone accessories and laptop essentials. Quality products for schools, offices and everyday use across the Western Highlands.">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">
  <div id="siteHeader"></div>
  <noscript><p class="empty-state">This website needs JavaScript turned on to show products and shop details.</p></noscript>

  <section class="hero-promo">
    <div class="container hero-promo-inner">
      <div>
        <div class="hero-badges" id="heroBadges"></div>
        <h1 id="heroTitle"></h1>
        <p class="lead" id="heroLead"></p>
        <div style="display:flex;flex-wrap:wrap;gap:0.75rem;">
          <a href="shop.html" class="btn btn-primary btn-lg" id="heroPrimary"></a>
          <a href="contact.html" class="btn btn-outline-white btn-lg" id="heroSecondary"></a>
        </div>
      </div>
      <div class="hero-visual">
        <div class="placeholder-box" data-slot="hero"><div><strong>Promo / Storefront Banner</strong><br><small>Replace with product or shop photo</small></div></div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;padding-bottom:2rem;">
    <div class="container">
      <div class="cat-cards" id="catCards"></div>
    </div>
  </section>

  <section class="section" style="background:#fff;border-top:1px solid var(--border);">
    <div class="container">
      <h2 class="section-title">Featured Products</h2>
      <p class="section-sub">Popular items available in our Mount Hagen shop</p>
      <div class="product-grid" id="featuredProducts"></div>
      <div class="text-center mt-6"><a href="shop.html" class="btn btn-primary">View All Products</a></div>
    </div>
  </section>

  <section class="why-strip">
    <div class="container">
      <div class="why-grid" id="whyGrid"></div>
    </div>
  </section>

  <section class="cta-band">
    <div class="container cta-band-inner">
      <div>
        <h2 id="ctaTitle"></h2>
        <p id="ctaText"></p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:0.75rem;">
        <a href="contact.html" class="btn btn-primary btn-lg">Contact Us</a>
        <a href="#" class="btn btn-white btn-lg" id="ctaPhone"></a>
      </div>
    </div>
  </section>

  <div id="siteFooter"></div>

  <script src="js/content.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/hero-bg.js"></script>
</body>
</html>
