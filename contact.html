<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Innovative PNG Ltd – Mount Hagen</title>
  <meta name="description" content="Visit, call or email Innovative PNG Ltd in Mount Hagen for stationery, phone accessories and laptop essentials.">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <div id="siteHeader"></div>
  <noscript><p class="empty-state">This website needs JavaScript turned on to show our contact details.</p></noscript>

  <section class="page-hero">
    <div class="container">
      <h1 id="pageTitle">Contact Us</h1>
      <p id="pageSub"></p>
    </div>
  </section>

  <section class="section">
    <div class="container contact-grid">
      <div>
        <div class="content-card"><h3>Visit the Shop</h3><p id="contactAddress"></p></div>
        <div class="content-card"><h3>Opening Hours</h3><p id="contactHours"></p></div>
        <div class="content-card"><h3>Phone &amp; Email</h3><div id="contactPhoneEmail"></div></div>
        <div class="placeholder-image map" data-slot="map"><div><strong>Map / Shop Frontage</strong><br><small>Replace with a real photo</small></div></div>
      </div>
      <div class="content-card">
        <h2 style="margin-bottom:0.5rem">Send a Message</h2>
        <p id="formIntro" style="color:var(--muted);margin-bottom:1.25rem;font-size:0.95rem"></p>
        <form id="contactForm">
          <div class="form-row">
            <div class="form-group"><label for="firstName">First Name *</label><input type="text" id="firstName" name="firstName" required autocomplete="given-name"></div>
            <div class="form-group"><label for="lastName">Last Name *</label><input type="text" id="lastName" name="lastName" required autocomplete="family-name"></div>
          </div>
          <div class="form-group"><label for="email">Email *</label><input type="email" id="email" name="email" required autocomplete="email"></div>
          <div class="form-group"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" autocomplete="tel"></div>
          <div class="form-group"><label for="message">Message *</label><textarea id="message" name="message" rows="5" required></textarea></div>
          <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <div id="siteFooter"></div>

  <script src="js/content.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
